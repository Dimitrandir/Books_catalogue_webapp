<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}Семейна библиотека{% endblock %}</title>
    <script>
        (function() {
            var stored = localStorage.getItem('theme');
            if (stored === 'light' || stored === 'dark') {
                document.documentElement.setAttribute('data-theme', stored);
            }
        })();
    </script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #fafafa;
            --surface: #ffffff;
            --surface-alt: #f0f0f0;
            --text: #1a1a1a;
            --muted: #666;
            --border: #ddd;
            --accent: #2f5d50;
            --danger: #a13b3b;
            --danger-bg: #fbeaea;
            --available-bg: #e3f3ea;
            --available-text: #1e6b45;
            --warning-bg: #fff6e0;
            --warning-border: #e0c264;
            --warning-text: #7a5c00;
            --placeholder-bg: #eee;
            --popup-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #15191b;
                --surface: #1e2426;
                --surface-alt: #2a3134;
                --text: #e6e8e6;
                --muted: #9aa39d;
                --border: #343b3d;
                --accent: #3fae8a;
                --danger: #e08585;
                --danger-bg: #4a2626;
                --available-bg: #1f3a30;
                --available-text: #7cd9ae;
                --warning-bg: #3d3419;
                --warning-border: #8a6f2a;
                --warning-text: #e0c264;
                --placeholder-bg: #2a3134;
                --popup-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
            }
        }
        :root[data-theme="dark"] {
            --bg: #15191b;
            --surface: #1e2426;
            --surface-alt: #2a3134;
            --text: #e6e8e6;
            --muted: #9aa39d;
            --border: #343b3d;
            --accent: #3fae8a;
            --danger: #e08585;
            --danger-bg: #4a2626;
            --available-bg: #1f3a30;
            --available-text: #7cd9ae;
            --warning-bg: #3d3419;
            --warning-border: #8a6f2a;
            --warning-text: #e0c264;
            --placeholder-bg: #2a3134;
            --popup-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            color: var(--text);
            background: var(--bg);
        }
        header {
            background: var(--accent);
            color: white;
            padding: 1rem 1.5rem;
        }
        header a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .theme-toggle {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 999px;
            width: 2rem;
            height: 2rem;
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-user {
            font-size: 0.85rem;
            font-weight: 400;
            opacity: 0.9;
        }
        .logout-form { display: inline; }
        .header-user button {
            background: none;
            border: none;
            color: white;
            font-weight: 400;
            text-decoration: underline;
            font-size: inherit;
            font-family: inherit;
            cursor: pointer;
            padding: 0;
        }
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        .filters input, .filters select {
            padding: 0.4rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 4px;
        }
        .filters input[type="text"] { flex: 1 1 200px; }
        .filters button {
            padding: 0.4rem 1rem;
            border: none;
            border-radius: 4px;
            background: var(--accent);
            color: white;
            cursor: pointer;
        }
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1rem;
        }
        .book-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }
        .book-card img, .book-card .no-cover {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            border-radius: 4px;
            background: var(--placeholder-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
        }
        .book-card .title { font-weight: 600; font-size: 0.95rem; }
        .book-card .authors { color: var(--muted); font-size: 0.85rem; }
        .badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
            margin-top: 0.35rem;
        }
        .badge.available { background: var(--available-bg); color: var(--available-text); }
        .badge.on-loan { background: var(--danger-bg); color: var(--danger); }
        .pagination { display: flex; gap: 0.5rem; margin-top: 1.5rem; }
        .pagination a, .pagination span {
            padding: 0.3rem 0.7rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            text-decoration: none;
            color: inherit;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid var(--border); }
        .back-link { display: inline-block; margin-bottom: 1rem; color: var(--accent); }
        .loan-form {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            align-items: center;
            margin-top: 0.35rem;
        }
        .loan-form select, .loan-form input, .loan-form button {
            padding: 0.25rem 0.4rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .loan-form button {
            background: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
        }
        .form-error { color: var(--danger); font-size: 0.8rem; width: 100%; }
        .title-warning {
            background: var(--warning-bg);
            border: 1px solid var(--warning-border);
            color: var(--warning-text);
            border-radius: 4px;
            padding: 0.4rem 0.6rem;
            font-size: 0.85rem;
            margin-top: 0.3rem;
        }
        .title-warning a { color: var(--warning-text); }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .page-header h1, .page-header h2 { margin: 0; }
        .header-actions { display: flex; gap: 0.5rem; align-items: center; }
        .button-link {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
        }
        .button-danger { background: var(--danger); }
        .entry-form { max-width: 500px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; }
        .entry-form p { margin: 0 0 0.9rem; display: flex; flex-direction: column; gap: 0.25rem; }
        .entry-form label { font-weight: 600; font-size: 0.9rem; }
        .entry-form input, .entry-form select, .entry-form textarea {
            padding: 0.4rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font: inherit;
        }
        .entry-form .hint { color: var(--muted); font-size: 0.85rem; }
        .entry-form button {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 4px;
            background: var(--accent);
            color: white;
            cursor: pointer;
            font-weight: 600;
        }
        .errorlist { color: var(--danger); font-size: 0.85rem; padding-left: 1rem; margin: 0.2rem 0; }

        .tag-picker { position: relative; }
        .tag-picker .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-bottom: 0.35rem;
        }
        .tag-picker .chip {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: var(--accent);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 999px;
            font-size: 0.85rem;
        }
        .tag-picker .chip button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            line-height: 1;
            padding: 0;
        }
        .tag-picker .tag-results {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-top: 0.35rem;
        }
        .tag-picker .tag-results:empty { margin-top: 0; }
        .tag-result {
            padding: 0.25rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            cursor: pointer;
            font-size: 0.85rem;
        }
        .tag-result:hover { background: var(--surface-alt); }
        .tag-empty { color: var(--muted); font-size: 0.8rem; }
        .tag-create {
            padding: 0.25rem 0.6rem;
            border: 1px dashed var(--accent);
            border-radius: 999px;
            background: var(--surface);
            color: var(--accent);
            cursor: pointer;
            font-size: 0.85rem;
        }
        .tag-create:hover { background: var(--available-bg); }

        .inline-add-select { display: flex; gap: 0.35rem; align-items: center; }
        .inline-add-select select { flex: 1; }
        .inline-add-btn {
            flex-shrink: 0;
            width: 2rem;
            height: 2rem;
            border: 1px dashed var(--accent);
            border-radius: 4px;
            background: var(--surface);
            color: var(--accent);
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
        }
        .inline-add-btn:hover { background: var(--available-bg); }

        .scan-btn {
            display: block;
            margin-top: 0.35rem;
            padding: 0.35rem 0.8rem;
            border: 1px dashed var(--accent);
            border-radius: 4px;
            background: var(--surface);
            color: var(--accent);
            cursor: pointer;
            font-size: 0.85rem;
        }
        .scan-btn:hover { background: var(--available-bg); }
        .scan-btn:disabled { opacity: 0.6; cursor: default; }

        .date-field { position: relative; display: inline-block; }
        .date-input { cursor: pointer; background: var(--surface); color: var(--text); width: 8.5rem; }
        .date-popup {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            z-index: 20;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem;
            box-shadow: var(--popup-shadow);
            width: 220px;
        }
        .date-popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.4rem;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .date-popup-header button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 0.1rem 0.5rem;
            color: var(--accent);
        }
        .date-popup-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 0.8rem;
        }
        .date-popup-dow { color: var(--muted); font-weight: 600; padding: 0.2rem 0; }
        .date-popup-day {
            background: none;
            border: none;
            padding: 0.3rem 0;
            border-radius: 4px;
            cursor: pointer;
        }
        .date-popup-day:hover { background: var(--surface-alt); }
        .date-popup-day.is-today { font-weight: 700; color: var(--accent); }
        .date-popup-day.is-selected { background: var(--accent); color: white; }
    </style>
</head>
<body>
    <header class="site-header">
        <a href="{% url 'catalog:book_list' %}">📚 Семейна библиотека</a>
        <span class="header-right">
            <button type="button" id="theme-toggle" class="theme-toggle" onclick="toggleTheme()"
                    aria-label="Превключи тема" title="Превключи светла/тъмна тема"></button>
            {% if user.is_authenticated %}
                <span class="header-user">
                    {{ user.get_username }} ·
                    <form method="post" action="{% url 'logout' %}" class="logout-form">
                        {% csrf_token %}
                        <button type="submit">изход</button>
                    </form>
                </span>
            {% endif %}
        </span>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
        function getCsrfToken(form) {
            return form.querySelector('[name=csrfmiddlewaretoken]').value;
        }

        function isDarkActive() {
            const explicit = document.documentElement.getAttribute('data-theme');
            if (explicit) return explicit === 'dark';
            return window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        function updateThemeToggleIcon() {
            const btn = document.getElementById('theme-toggle');
            if (btn) btn.textContent = isDarkActive() ? '☀️' : '🌙';
        }

        function toggleTheme() {
            const next = isDarkActive() ? 'light' : 'dark';
            localStorage.setItem('theme', next);
            document.documentElement.setAttribute('data-theme', next);
            updateThemeToggleIcon();
        }

        updateThemeToggleIcon();

        function tagPickerAdd(picker, id, name) {
            const field = picker.dataset.field;
            const chips = picker.querySelector('.chips');

            if (chips.querySelector(`[data-id="${id}"]`)) return;

            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.dataset.id = id;

            const hidden = document.createElement('input');
            hidden.type = 'hidden';
            hidden.name = field;
            hidden.value = id;

            const remove = document.createElement('button');
            remove.type = 'button';
            remove.textContent = '×';
            remove.addEventListener('click', () => chip.remove());

            chip.append(document.createTextNode(name + ' '), hidden, remove);
            chips.appendChild(chip);

            const searchInput = picker.querySelector('.tag-search');
            searchInput.value = '';
            searchInput.focus();
            htmx.trigger(searchInput, 'keyup');
        }

        function tagPickerAddResult(button) {
            tagPickerAdd(button.closest('.tag-picker'), button.dataset.id, button.dataset.name);
        }

        function tagPickerCreate(button, url) {
            const picker = button.closest('.tag-picker');
            const name = picker.querySelector('.tag-search').value.trim();
            if (!name) return;

            fetch(url, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCsrfToken(picker.closest('form')),
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'name=' + encodeURIComponent(name),
            })
                .then(response => response.json())
                .then(data => tagPickerAdd(picker, data.id, data.name))
                .catch(() => alert('Грешка при добавяне.'));
        }

        function selectSetOption(select, id, name) {
            let option = select.querySelector(`option[value="${id}"]`);
            if (!option) {
                option = document.createElement('option');
                option.value = id;
                select.appendChild(option);
            }
            option.textContent = name;
            select.value = id;
        }

        function inlineSelectCreate(button, url, promptText) {
            const name = prompt(promptText);
            if (!name || !name.trim()) return;

            const select = button.closest('.inline-add-select').querySelector('select');
            fetch(url, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCsrfToken(button.closest('form')),
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'name=' + encodeURIComponent(name.trim()),
            })
                .then(response => response.json())
                .then(data => selectSetOption(select, data.id, data.name))
                .catch(() => alert('Грешка при добавяне.'));
        }

        function scanCoverStart(button) {
            const form = button.closest('form');
            const fileInput = form.querySelector('input[type=file][name=cover_image]');
            const file = fileInput.files[0];
            const status = document.getElementById('scan-status');

            if (!file) {
                status.textContent = 'Първо избери снимка на корицата.';
                return;
            }

            const formData = new FormData();
            formData.append('photo', file);

            button.disabled = true;
            status.textContent = 'Разпознаване…';

            fetch("{% url 'scanner:scan_cover' %}", {
                method: 'POST',
                headers: {'X-CSRFToken': getCsrfToken(form)},
                body: formData,
            })
                .then(response => response.json().then(data => ({ok: response.ok, data})))
                .then(({ok, data}) => {
                    if (!ok) throw new Error(data.error || 'Грешка при разпознаване.');

                    if (data.title) form.title.value = data.title;
                    if (data.year) form.year.value = data.year;
                    if (data.summary) form.summary.value = data.summary;

                    const authorsPicker = form.querySelector('.tag-picker[data-field="authors"]');
                    (data.authors || []).forEach(a => tagPickerAdd(authorsPicker, a.id, a.name));

                    if (data.publisher) {
                        selectSetOption(form.querySelector('select[name=publisher]'), data.publisher.id, data.publisher.name);
                    }

                    status.textContent = 'Разпознато — прегледай и коригирай преди запис.';
                })
                .catch(error => { status.textContent = error.message || 'Грешка при разпознаване.'; })
                .finally(() => { button.disabled = false; });
        }

        const BG_MONTHS = ['Януари', 'Февруари', 'Март', 'Април', 'Май', 'Юни',
            'Юли', 'Август', 'Септември', 'Октомври', 'Ноември', 'Декември'];
        const BG_DAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'];

        function datePickerRemoveExisting() {
            document.querySelectorAll('.date-popup').forEach(el => el.remove());
            document.removeEventListener('click', datePickerOutsideClick, true);
        }

        function datePickerOutsideClick(event) {
            if (!event.target.closest('.date-field')) datePickerRemoveExisting();
        }

        function datePickerOpen(input) {
            const alreadyOpenForThis = input.parentElement.querySelector('.date-popup');
            datePickerRemoveExisting();
            if (alreadyOpenForThis) return;

            const initial = input.value ? new Date(input.value + 'T00:00:00') : new Date();
            datePickerRender(input, initial.getFullYear(), initial.getMonth());
            document.addEventListener('click', datePickerOutsideClick, true);
        }

        function datePickerRender(input, year, month) {
            document.querySelectorAll('.date-popup').forEach(el => el.remove());

            const popup = document.createElement('div');
            popup.className = 'date-popup';
            popup.addEventListener('click', event => event.stopPropagation());

            const header = document.createElement('div');
            header.className = 'date-popup-header';

            const prev = document.createElement('button');
            prev.type = 'button';
            prev.textContent = '‹';
            prev.addEventListener('click', () => {
                const m = month === 0 ? 11 : month - 1;
                datePickerRender(input, month === 0 ? year - 1 : year, m);
            });

            const label = document.createElement('span');
            label.textContent = `${BG_MONTHS[month]} ${year}`;

            const next = document.createElement('button');
            next.type = 'button';
            next.textContent = '›';
            next.addEventListener('click', () => {
                const m = month === 11 ? 0 : month + 1;
                datePickerRender(input, month === 11 ? year + 1 : year, m);
            });

            header.append(prev, label, next);

            const grid = document.createElement('div');
            grid.className = 'date-popup-grid';
            BG_DAYS.forEach(dow => {
                const cell = document.createElement('span');
                cell.className = 'date-popup-dow';
                cell.textContent = dow;
                grid.appendChild(cell);
            });

            const firstWeekday = (new Date(year, month, 1).getDay() + 6) % 7; // Monday = 0
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const todayIso = new Date().toISOString().slice(0, 10);

            for (let i = 0; i < firstWeekday; i++) {
                grid.appendChild(document.createElement('span'));
            }
            for (let day = 1; day <= daysInMonth; day++) {
                const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const cell = document.createElement('button');
                cell.type = 'button';
                cell.className = 'date-popup-day';
                cell.textContent = day;
                if (iso === todayIso) cell.classList.add('is-today');
                if (iso === input.value) cell.classList.add('is-selected');
                cell.addEventListener('click', () => {
                    input.value = iso;
                    datePickerRemoveExisting();
                });
                grid.appendChild(cell);
            }

            popup.append(header, grid);
            input.parentElement.appendChild(popup);
        }
    </script>
</body>
</html>
