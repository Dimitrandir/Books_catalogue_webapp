<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Семейна библиотека{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        :root {
            --border: #ddd;
            --muted: #666;
            --accent: #2f5d50;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            color: #1a1a1a;
            background: #fafafa;
        }
        header {
            background: var(--accent);
            color: white;
            padding: 1rem 1.5rem;
        }
        header a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
        }
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        .filters input, .filters select {
            padding: 0.4rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 4px;
        }
        .filters input[type="text"] { flex: 1 1 200px; }
        .filters button {
            padding: 0.4rem 1rem;
            border: none;
            border-radius: 4px;
            background: var(--accent);
            color: white;
            cursor: pointer;
        }
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1rem;
        }
        .book-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }
        .book-card img, .book-card .no-cover {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            border-radius: 4px;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
        }
        .book-card .title { font-weight: 600; font-size: 0.95rem; }
        .book-card .authors { color: var(--muted); font-size: 0.85rem; }
        .badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
            margin-top: 0.35rem;
        }
        .badge.available { background: #e3f3ea; color: #1e6b45; }
        .badge.on-loan { background: #fbeaea; color: #a13b3b; }
        .pagination { display: flex; gap: 0.5rem; margin-top: 1.5rem; }
        .pagination a, .pagination span {
            padding: 0.3rem 0.7rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            text-decoration: none;
            color: inherit;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid var(--border); }
        .back-link { display: inline-block; margin-bottom: 1rem; color: var(--accent); }
        .loan-form {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            align-items: center;
            margin-top: 0.35rem;
        }
        .loan-form select, .loan-form input, .loan-form button {
            padding: 0.25rem 0.4rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .loan-form button {
            background: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
        }
        .form-error { color: #a13b3b; font-size: 0.8rem; width: 100%; }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .page-header h1 { margin: 0; }
        .button-link {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
        }
        .entry-form { max-width: 500px; background: white; border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; }
        .entry-form p { margin: 0 0 0.9rem; display: flex; flex-direction: column; gap: 0.25rem; }
        .entry-form label { font-weight: 600; font-size: 0.9rem; }
        .entry-form input, .entry-form select, .entry-form textarea {
            padding: 0.4rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font: inherit;
        }
        .entry-form .hint { color: var(--muted); font-size: 0.85rem; }
        .entry-form button {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 4px;
            background: var(--accent);
            color: white;
            cursor: pointer;
            font-weight: 600;
        }
        .errorlist { color: #a13b3b; font-size: 0.85rem; padding-left: 1rem; margin: 0.2rem 0; }

        .tag-picker { position: relative; }
        .tag-picker .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-bottom: 0.35rem;
        }
        .tag-picker .chip {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: var(--accent);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 999px;
            font-size: 0.85rem;
        }
        .tag-picker .chip button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            line-height: 1;
            padding: 0;
        }
        .tag-picker .tag-results {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-top: 0.35rem;
        }
        .tag-picker .tag-results:empty { margin-top: 0; }
        .tag-result {
            padding: 0.25rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: white;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .tag-result:hover { background: #f0f0f0; }
        .tag-empty { color: var(--muted); font-size: 0.8rem; }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'catalog:book_list' %}">📚 Семейна библиотека</a>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
        function tagPickerAdd(button) {
            const picker = button.closest('.tag-picker');
            const field = picker.dataset.field;
            const id = button.dataset.id;
            const name = button.dataset.name;
            const chips = picker.querySelector('.chips');

            if (chips.querySelector(`[data-id="${id}"]`)) return;

            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.dataset.id = id;

            const hidden = document.createElement('input');
            hidden.type = 'hidden';
            hidden.name = field;
            hidden.value = id;

            const remove = document.createElement('button');
            remove.type = 'button';
            remove.textContent = '×';
            remove.addEventListener('click', () => chip.remove());

            chip.append(document.createTextNode(name + ' '), hidden, remove);
            chips.appendChild(chip);

            const searchInput = picker.querySelector('.tag-search');
            searchInput.value = '';
            searchInput.focus();
            htmx.trigger(searchInput, 'keyup');
        }
    </script>
</body>
</html>
